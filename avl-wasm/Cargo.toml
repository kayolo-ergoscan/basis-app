[package]
name = "basis-avl-wasm"
version = "0.1.0"
edition = "2021"
description = "Ergo AVL+ authenticated dictionary (ergo_avltree_rust 0.1.1) for the browser: C ABI over byte buffers, no wasm-bindgen"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "basis_avl_wasm"
# cdylib -> avl.wasm for the browser; rlib -> native tests use the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The real thing, from crates.io, pinned exactly (sha256 040e6822...0668 in Cargo.lock).
# NOT the copy vendored in basis-tracker/temp/vendors: that copy turns Insert into
# insert-or-update, which the chain (JVM scrypto, sigma AvlTree.insert) does not do.
ergo_avltree_rust = "=0.1.1"
bytes = { version = "1.0.1", default-features = false }
anyhow = { version = "1.0", default-features = false }
blake2 = { version = "0.10.6", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
# Native tests replay thousands of operations; a little optimisation keeps them quick.
opt-level = 1

[dev-dependencies]
# tests only (vector files); never part of avl.wasm
serde_json = "1"
